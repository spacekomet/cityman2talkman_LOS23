name: Build TWRP zip

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      vendor_ref:
        description: "Branch, tag or commit of android_vendor_msft_talkman"
        default: "46f96c134d515acf66a883626eab5a0fe234dbfa"
      kernel_tag:
        description: "Kernel release tag (empty = latest release)"
        default: ""

permissions:
  contents: write

env:
  KERNEL_REPO: spacekomet/android_kernel_mmo_msm8994
  KERNEL_TAG: ${{ inputs.kernel_tag }}
  VENDOR_REPO: spacekomet/android_vendor_msft_talkman
  VENDOR_REF: ${{ inputs.vendor_ref || '46f96c134d515acf66a883626eab5a0fe234dbfa' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # only needed if boot.img is stored with Git LFS

      # fetch only the firmware folder, not the whole 180 MB vendor tree
      - name: Fetch firmware from vendor repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VENDOR_REPO }}
          ref: ${{ env.VENDOR_REF }}
          path: android_vendor_msft_talkman
          sparse-checkout: proprietary/vendor/firmware
          # token: ${{ secrets.VENDOR_TOKEN }}   # needed only if the repo is private

      - name: Download kernel from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kernel
          gh release download $KERNEL_TAG -R "$KERNEL_REPO" \
            -p Image.gz-dtb -p SHA256SUMS -D kernel
          (cd kernel && grep ' Image.gz-dtb$' SHA256SUMS | sha256sum -c -)

      # base/boot.img = your current working boot.img (ramdisk, cmdline, header);
      # only its kernel (Image.gz-dtb with both dtbs) is replaced
      - name: Repack boot.img with new kernel
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq abootimg
          BASE=base/boot.img; [ -f "$BASE" ] || BASE=boot.img
          [ -f "$BASE" ] || { echo "no base boot.img (base/boot.img)"; exit 1; }
          cp "$BASE" new-boot.img
          abootimg -i new-boot.img
          abootimg -u new-boot.img -k kernel/Image.gz-dtb
          [ "$(wc -c < new-boot.img)" = "$(wc -c < "$BASE")" ] || \
            { echo "image size changed: kernel too big for the original boot.img size"; exit 1; }
          abootimg -x new-boot.img /tmp/b.cfg /tmp/k.out /tmp/r.out
          cmp /tmp/k.out kernel/Image.gz-dtb
          mv new-boot.img boot.img
          abootimg -i boot.img | grep -E 'size|cmdline'

      - name: Build zip
        run: |
          sh -n META-INF/com/google/android/update-binary
          FW_SRC="$PWD/android_vendor_msft_talkman" sh ./build.sh
          NAME="lumia950-flash-${GITHUB_SHA::7}.zip"
          mv ../lumia-flash.zip "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "ZIP=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: lumia950-flash
          path: |
            lumia950-flash-*.zip
            lumia950-flash-*.zip.sha256

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "$GITHUB_REF_NAME" --notes "TWRP zip for Lumia 950 (talkman), firmware from ${VENDOR_REF::7}"
